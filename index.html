<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>霓虹突击 · NEON STRIKE (FPS)</title>
<style>
  :root{
    --bg:#04050a; --line:#232a46; --cyan:#35e6ff; --pink:#ff3d7f;
    --lime:#7dff6b; --amber:#ffc857; --txt:#dfe6ff; --dim:#7f8bb3;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:16px;
    user-select:none;
  }
  #app{width:100%; max-width:1180px;}
  header{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:10px;}
  h1{font-size:19px; margin:0; letter-spacing:3px; font-weight:800;
    background:linear-gradient(90deg,var(--cyan),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  h1 span{font-size:11px; letter-spacing:4px; color:var(--dim); -webkit-text-fill-color:var(--dim); margin-left:8px;}
  .hud{display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
  .stat{background:linear-gradient(180deg,#141a30,#0c0f1d); border:1px solid var(--line);
    border-radius:10px; padding:6px 12px; min-width:70px; box-shadow:inset 0 1px 0 rgba(255,255,255,.05);}
  .stat label{display:block; font-size:10px; letter-spacing:2px; color:var(--dim); text-transform:uppercase;}
  .stat b{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums;}
  .bar{width:100%; height:6px; border-radius:99px; background:#232a46; overflow:hidden; margin:5px 0 3px;}
  .bar i{display:block; height:100%; width:100%; border-radius:99px; background:linear-gradient(90deg,#35e6ff,#7dff6b); transition:width .12s linear;}
  .bar.low i{background:linear-gradient(90deg,#ff3d7f,#ff8a3d);}
  #dash.ready b{color:var(--lime);} #dash.cool b{color:var(--dim);}

  #stage{position:relative; border-radius:14px; overflow:hidden; border:1px solid var(--line);
    box-shadow:0 30px 80px rgba(0,0,0,.6); background:#04050a;}
  canvas{display:block; width:100%; height:auto; cursor:none; touch-action:none;}

  /* 准星 */
  #cross{position:absolute; left:50%; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px; pointer-events:none; z-index:4;}
  #cross i{position:absolute; background:rgba(53,230,255,.92); box-shadow:0 0 6px rgba(53,230,255,.8);}
  #cross i:nth-child(1){left:50%; top:0; width:2px; height:8px; margin-left:-1px;}
  #cross i:nth-child(2){left:50%; bottom:0; width:2px; height:8px; margin-left:-1px;}
  #cross i:nth-child(3){top:50%; left:0; height:2px; width:8px; margin-top:-1px;}
  #cross i:nth-child(4){top:50%; right:0; height:2px; width:8px; margin-top:-1px;}
  #cross b{position:absolute; left:50%; top:50%; width:3px; height:3px; margin:-1.5px 0 0 -1.5px; border-radius:50%; background:#fff;}
  #hitmark{position:absolute; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; pointer-events:none; z-index:5; opacity:0;}
  #hitmark i{position:absolute; width:9px; height:2px; background:#fff; box-shadow:0 0 6px #fff;}
  #hitmark i:nth-child(1){top:4px; left:2px; transform:rotate(45deg);}
  #hitmark i:nth-child(2){top:4px; right:2px; transform:rotate(-45deg);}
  #hitmark i:nth-child(3){bottom:4px; left:2px; transform:rotate(-45deg);}
  #hitmark i:nth-child(4){bottom:4px; right:2px; transform:rotate(45deg);}
  #hitmark.kill i{background:#ff3d7f; box-shadow:0 0 8px #ff3d7f;}
  #dmg{position:absolute; inset:0; pointer-events:none; z-index:3; opacity:0;
    background:radial-gradient(ellipse at center, rgba(255,0,60,0) 45%, rgba(255,0,60,.55) 100%);}
  #lowhp{position:absolute; inset:0; pointer-events:none; z-index:2; opacity:0;
    background:radial-gradient(ellipse at center, rgba(255,0,40,0) 40%, rgba(255,0,40,.45) 100%);}

  #bossWrap{position:absolute; top:12px; left:50%; transform:translateX(-50%); width:48%; display:none; z-index:5;}
  #waveBanner{position:absolute; left:50%; top:34px; transform:translateX(-50%); z-index:5; opacity:0;
    pointer-events:none; text-align:center; transition:opacity .18s linear;}
  #waveBanner b{display:block; font-size:26px; letter-spacing:6px; color:var(--cyan);
    text-shadow:0 0 18px rgba(53,230,255,.55);}
  #waveBanner span{display:block; margin-top:4px; font-size:12px; letter-spacing:3px; color:var(--pink);
    text-shadow:0 0 12px rgba(255,61,127,.6);}
  #bossWrap.on{display:block;}
  #bossWrap span{display:block; text-align:center; font-size:11px; letter-spacing:4px; color:var(--pink); margin-bottom:5px; text-shadow:0 0 12px rgba(255,61,127,.7);}
  #bossBar{height:9px; background:#241326; border:1px solid #56213f; border-radius:99px; overflow:hidden;}
  #bossBar i{display:block; height:100%; width:100%; background:linear-gradient(90deg,#ff3d7f,#ffc857); transition:width .15s linear;}

  #overlay{position:absolute; inset:0; background:rgba(4,5,10,.84); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px; text-align:center; z-index:6;}
  #overlay.hide{display:none;}
  .panel{max-width:580px; animation:pop .28s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:scale(.9); opacity:0} to{transform:scale(1); opacity:1}}
  .panel h2{margin:0 0 10px; font-size:32px; letter-spacing:6px;
    background:linear-gradient(90deg,var(--cyan),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .panel p{color:var(--dim); margin:0 0 16px; line-height:1.7; font-size:14px;}
  .keys{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:8px; margin:0 0 20px; text-align:left;}
  .keys div{background:#11162a; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12px; color:var(--dim);}
  .keys b{color:var(--cyan); font-weight:700; letter-spacing:1px;}
  .btn{cursor:pointer; border:0; border-radius:99px; padding:13px 38px; font-size:15px; font-weight:800;
    letter-spacing:3px; color:#04060f; background:linear-gradient(90deg,var(--cyan),#7dff6b);
    box-shadow:0 0 30px rgba(53,230,255,.35); transition:transform .12s, box-shadow .12s;}
  .btn:hover{transform:translateY(-2px); box-shadow:0 6px 34px rgba(53,230,255,.55);}
  #loading{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--dim); letter-spacing:3px; font-size:13px; z-index:7; background:#04050a;}
  #loading.hide{display:none;}
  footer{margin-top:10px; text-align:center; font-size:12px; color:var(--dim); letter-spacing:1px;}
  #lookmode{display:inline-block; margin-bottom:6px; padding:4px 12px; border-radius:99px;
    border:1px solid var(--line); background:#11162a; font-size:12px;}
  #lookmode.ok{color:var(--lime); border-color:#2a4a2a;}
  #lookmode.warn{color:var(--amber); border-color:#4a3a1a;}
  kbd{background:#151a2e; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 6px; font-size:11px; color:var(--cyan);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>霓虹突击<span>NEON STRIKE · FIRST PERSON</span></h1>
    <div class="hud">
      <div class="stat"><label>生命</label><div class="bar" id="hpBar"><i id="hpFill"></i></div><b id="hpText">100</b></div>
      <div class="stat"><label>武器</label><b id="weaponText">脉冲手枪</b></div>
      <div class="stat"><label>弹药</label><b id="ammoText">30 / 30</b></div>
      <div class="stat" id="dash"><label>冲刺</label><b id="dashText">就绪</b></div>
      <div class="stat"><label>波次</label><b id="waveText">1</b></div>
      <div class="stat"><label>得分</label><b id="scoreText">0</b></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="game"></canvas>
    <div id="cross"><i></i><i></i><i></i><i></i><b></b></div>
    <div id="hitmark"><i></i><i></i><i></i><i></i></div>
    <div id="dmg"></div>
    <div id="lowhp"></div>
    <div id="bossWrap"><span>⚠ 首领单位 ⚠</span><div id="bossBar"><i id="bossFill"></i></div></div>
    <div id="waveBanner"><b></b><span></span></div>
    <div id="loading">正在初始化 WEBGL 场景…</div>
    <div id="overlay" class="hide">
      <div class="panel">
        <h2 id="ovTitle">霓虹突击</h2>
        <p id="ovBody">第一人称射击。点击画面锁定鼠标，Esc 解除锁定。</p>
        <div class="keys" id="ovKeys">
          <div><b>移动鼠标</b><br>转头瞄准</div>
          <div><b>WASD</b><br>移动</div>
          <div><b>鼠标左键</b><br>射击</div>
          <div><b>Shift</b><br>冲刺</div>
          <div><b>空格</b><br>跳跃</div>
          <div><b>R</b><br>换弹</div>
          <div><b>1 / 2 / Q</b><br>切换武器</div>
          <div><b>滚轮</b><br>切换武器</div>
        </div>
        <button class="btn" id="ovBtn">开始游戏</button>
      </div>
    </div>
  </div>

  <footer>
    <div id="lookmode" class="warn">自由鼠标模式 · 把鼠标移离画面中心即可转头（点击画面可锁定）</div><br>
    <kbd>点击画面</kbd> 锁定鼠标进入游戏 &nbsp;·&nbsp; <kbd>Esc</kbd> 暂停 &nbsp;·&nbsp;
    <kbd>WASD</kbd> 移动 &nbsp;·&nbsp; <kbd>Shift</kbd> 冲刺 &nbsp;·&nbsp; <kbd>空格</kbd> 跳跃 &nbsp;·&nbsp;
    <kbd>R</kbd> 换弹 &nbsp;·&nbsp; <kbd>M</kbd> 静音
  </footer>
</div>

<script src="./vendor/three.min.js"></script>
<script>
(() => {
'use strict';

/* ============================================================
   霓虹突击 · NEON STRIKE — 第一人称射击
   Three.js r160 (UMD) · 全部几何体程序化生成，不依赖任何外部资源
   ============================================================ */

const $ = id => document.getElementById(id);
const el = {
  stage: $('stage'), hpFill: $('hpFill'), hpText: $('hpText'), hpBar: $('hpBar'),
  ammo: $('ammoText'), weapon: $('weaponText'), dash: $('dash'), dashText: $('dashText'),
  wave: $('waveText'), score: $('scoreText'),
  overlay: $('overlay'), ovTitle: $('ovTitle'), ovBody: $('ovBody'), ovKeys: $('ovKeys'), ovBtn: $('ovBtn'),
  cross: $('cross'), hitmark: $('hitmark'), dmg: $('dmg'), lowhp: $('lowhp'), lookMode: $('lookmode'),
  bossWrap: $('bossWrap'), bossFill: $('bossFill'), loading: $('loading'),
  banner: $('waveBanner')
};

/* ---------- 工具 ---------- */
const rand  = (a, b) => a + Math.random() * (b - a);
const randI = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
// 圆柱几何体的默认轴是局部 +Y；strut() 要把"两点连线"转成 quaternion，就用它当基准方向。
const AXIS_Y = new THREE.Vector3(0, 1, 0);

/* ---------- 常量 ---------- */
const ARENA = 28;                 // 场地半宽（正方形 56x56）
const WALL_H = 7;
const EYE_H = 1.65;               // 视高
const P_R = 0.45;                 // 玩家碰撞半径
const WALK = 6.4, SPRINT = 10.6, ACCEL = 13, FRICTION = 11;
const GRAVITY = 22, JUMP_V = 6.4;
const MAG = 30;                      // 初始弹匣（切枪后按武器定义重置）
const SENS = 0.0022;
const TURN_RATE = 2.4;          // 自由模式：光标贴边时的持续转向速度（弧度/秒）
const RECOIL_RECOVER = 0.42;    // 枪口上跳回收速度（弧度/秒）
let lastX = null, lastY = null;   // 自由模式下光标的上一位置
let edgeDX = 0, edgeDY = 0;       // 光标撞到窗口边缘时的持续转向方向

/* ============================================================
   1. 场景
   ============================================================ */
const canvas = $('game');
let renderer, scene, camera, clock;

function initThree() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0c1018);
  scene.fog = new THREE.Fog(0x0c1018, 26, 84);

  camera = new THREE.PerspectiveCamera(76, 1, 0.05, 220);
  camera.rotation.order = 'YXZ';
  camera.position.set(0, EYE_H, ARENA * 0.55);
  scene.add(camera);

  scene.add(new THREE.HemisphereLight(0x6b8fd0, 0x1a1d28, 0.95));
  const sun = new THREE.DirectionalLight(0xdce8ff, 1.35);
  sun.position.set(16, 34, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1536, 1536);
  const S = ARENA + 8;
  sun.shadow.camera.left = -S; sun.shadow.camera.right = S;
  sun.shadow.camera.top = S;   sun.shadow.camera.bottom = -S;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 100;
  sun.shadow.bias = -0.0012;
  scene.add(sun);

  // 视图模型补光：相机随身的一盏小射灯。
  // 真实 FPS 都会单独给武器打光，否则在暗场景里枪只剩一个剪影。
  // 用 layers 把这盏灯限制在图层 1（只有视图模型在图层 1），
  // 这样它只照亮手里的枪，不会在地上拖出一圈假的光斑。
  const gunKey = new THREE.PointLight(0xffe0b4, 5.2, 2.8, 2);
  gunKey.position.set(0.42, 0.30, -0.18);
  gunKey.layers.set(1);
  camera.add(gunKey);
  // 冷色补光，从左下方勾边，避免枪变成一坨黑
  const gunFill = new THREE.PointLight(0x74b6ff, 3.2, 2.6, 2);
  gunFill.position.set(-0.36, -0.06, -0.34);
  gunFill.layers.set(1);
  camera.add(gunFill);
  camera.layers.enable(1);      // 相机要能看到图层 1


  clock = new THREE.Clock();
  resize();
  addEventListener('resize', resize);
}

/** 世界几何（必须在 initMaterials 之后调用，因为要用到材质） */
function buildWorld() {
  // 地面（真实混凝土）
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(ARENA * 2 + 8, ARENA * 2 + 8),
    MAT.floor
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // 墙体（金属压筋板）
  const trimMat = new THREE.MeshStandardMaterial({
    color: 0x0a0e1c, emissive: 0x35e6ff, emissiveIntensity: 1.6, roughness: 0.4, metalness: 0.2
  });
  const L = ARENA * 2;
  const mkWall = (w, d, x, z) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, WALL_H, d), MAT.wall);
    m.position.set(x, WALL_H / 2, z);
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
    // 顶部霓虹条
    const t = new THREE.Mesh(new THREE.BoxGeometry(w, 0.16, d), trimMat);
    t.position.set(x, WALL_H - 0.12, z);
    scene.add(t);
    // 底部踢脚（防撞条）
    const k = new THREE.Mesh(new THREE.BoxGeometry(w * 1.002, 0.34, d * 1.05), MAT.pipe);
    k.position.set(x, 0.17, z);
    k.receiveShadow = true;
    scene.add(k);
  };
  mkWall(L + 4, 2, 0, -ARENA - 1); mkWall(L + 4, 2, 0, ARENA + 1);
  mkWall(2, L + 4, -ARENA - 1, 0); mkWall(2, L + 4, ARENA + 1, 0);

  // 天花板 + 钢桁架 + 吊灯（让场景成为一个封闭的工业空间）
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(L + 4, L + 4), MAT.ceiling);
  ceil.rotation.x = Math.PI / 2;
  ceil.position.y = WALL_H;
  scene.add(ceil);
  const beamMat = MAT.pipe;
  for (let i = -2; i <= 2; i++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(L + 4, 0.42, 0.3), beamMat);
    b.position.set(0, WALL_H - 0.25, i * 11);
    b.castShadow = true;
    scene.add(b);
    // 桁架斜撑
    for (let k = -3; k <= 3; k++) {
      const br = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 3.4), beamMat);
      br.position.set(k * 8, WALL_H - 0.62, i * 11);
      br.rotation.x = (k % 2 ? 1 : -1) * 0.72;
      scene.add(br);
    }
  }
  // 沿墙的管道
  for (const [ax, az, rot, len] of [[0, -ARENA - 0.4, 0, L], [0, ARENA + 0.4, 0, L],
                                   [-ARENA - 0.4, 0, Math.PI / 2, L], [ARENA + 0.4, 0, Math.PI / 2, L]]) {
    for (let p = 0; p < 2; p++) {
      const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.16 - p * 0.05, 0.16 - p * 0.05, len, 10), MAT.pipe);
      pipe.rotation.z = Math.PI / 2;
      pipe.rotation.y = rot;
      pipe.position.set(ax + (rot ? 0 : 0), 4.6 + p * 0.55, az + (rot ? 0 : 0));
      pipe.castShadow = true;
      scene.add(pipe);
    }
  }
  // 天花灯具（发光面板 + 点光源）
  // 点光源数量是逐片元成本的主要来源：只放 2 盏真实灯，
  // 其余位置靠发光面板 + 环境贴图撑起亮度，省下的开销留给贴图细节。
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xfff0d2, toneMapped: false });
  const lampPos = [[-11, -11], [11, 11], [-11, 11], [11, -11]];
  lampPos.forEach(([x, z], i) => {
    const housing = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.3, 1.5), beamMat);
    housing.position.set(x, WALL_H - 0.42, z);
    scene.add(housing);
    const panel = new THREE.Mesh(new THREE.PlaneGeometry(3.1, 1.2), lampMat);
    panel.rotation.x = Math.PI / 2;
    panel.position.set(x, WALL_H - 0.58, z);
    scene.add(panel);
    if (i < 2) {                       // 只有 2 盏是真的光源
      const pl = new THREE.PointLight(0xffe3b8, 420, 52, 2);
      pl.position.set(x, WALL_H - 1.0, z);
      scene.add(pl);
    }
  });

  // 掩体柱
  const boxes = [];
  const spots = [
    [-12, -10, 3.2, 3.2, 3.4], [11, -12, 4.2, 2.6, 4.6], [-8, 13, 2.8, 4.4, 2.8],
    [14, 9, 3.6, 3.6, 5.0], [0, -3, 2.4, 2.4, 2.6], [-16, 3, 2.2, 5.0, 2.4],
    [5, 18, 4.6, 2.2, 3.0], [-3, -19, 3.4, 3.4, 3.4]
  ];
  for (const [x, z, w, d, h] of spots) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), MAT.pillar);
    m.position.set(x, h / 2, z);
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
    coverMeshes.push(m);      // 玩家的射线会被这根柱子挡住
    // 顶部发光边
    const e = new THREE.Mesh(new THREE.BoxGeometry(w * 1.01, 0.12, d * 1.01), trimMat);
    e.position.set(x, h - 0.1, z);
    scene.add(e);
    // 柱角护条
    for (const sx of [1, -1]) {
      const c = new THREE.Mesh(new THREE.BoxGeometry(0.14, h * 0.96, 0.14), MAT.pipe);
      c.position.set(x + sx * (w / 2 - 0.05), h / 2, z + (d / 2 - 0.05));
      c.castShadow = true;
      scene.add(c);
    }
    boxes.push({ x: x - w / 2, z: z - d / 2, w, d, h });
  }
  // 掩体参与碰撞
  obstacles = boxes;

  // 角落氛围灯（2 盏，够用且省开销）
  for (const [x, z, c] of [[-ARENA + 5, -ARENA + 5, 0x35e6ff], [ARENA - 5, ARENA - 5, 0xc04dff]]) {
    const l = new THREE.PointLight(c, 190, 30, 2);
    l.position.set(x, 5.2, z);
    scene.add(l);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 10),
      new THREE.MeshBasicMaterial({ color: c, toneMapped: false }));
    bulb.position.copy(l.position);
    scene.add(bulb);
  }

  clock = new THREE.Clock();
  resize();
  addEventListener('resize', resize);
}
function resize() {
  const w = el.stage.clientWidth;
  const h = Math.round(w * 0.6);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

/* ---------- 程序化贴图 ---------- */
let glowTex = null;
function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0.00, 'rgba(255,255,255,1)');
  grd.addColorStop(0.18, 'rgba(255,255,255,0.55)');
  grd.addColorStop(0.45, 'rgba(255,255,255,0.16)');
  grd.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function addGlow(parent, color, size, opacity = 0.9) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: new THREE.Color(color), blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, opacity, toneMapped: false
  }));
  s.scale.set(size, size, 1);
  parent.add(s);
  return s;
}
function neonMat(color, emissive, ei = 1.2, rough = 0.4, metal = 0.4) {
  return new THREE.MeshStandardMaterial({
    color, emissive: new THREE.Color(emissive), emissiveIntensity: ei, roughness: rough, metalness: metal
  });
}
